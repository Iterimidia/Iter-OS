name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários/integração (Vitest, sem rede real)
        run: npm test

      # `npm run build` não depende de VITE_SUPABASE_URL/PUBLISHABLE_KEY reais
      # (só falharia em runtime, num browser de verdade) -- roda sem secrets.
      - name: Build de produção
        run: npm run build
